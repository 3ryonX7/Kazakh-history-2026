<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><meta name="theme-color" content="#0c1624"><meta name="description" content="QAZAQ HISTORY — interactive history of Kazakhstan, 1917–1937. Timeline and secure quiz in three languages."><title>QAZAQ HISTORY · Quiz</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="top"><button class="hamburger" id="openMenu" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="brand">QAZAQ <span>HISTORY</span><small>1917 — 1937</small></div><nav class="desktop-nav" aria-label="Main navigation"><button data-page="home" id="deskHome"></button><button data-page="timeline" id="deskTimeline"></button><button data-page="quiz" id="deskQuiz"></button><button data-page="stats" id="deskStats"></button></nav><div class="top-right"><select class="lang" id="language" aria-label="Language"><option value="kk">Қазақша</option><option value="ru">Русский</option><option value="en">English</option></select></div></header>
<div class="menu-backdrop" id="shade"></div><aside class="sidebar" id="sidebar" aria-hidden="true"><div class="sidebar-head"><strong class="brand">QAZAQ <span>HISTORY</span></strong><button class="close" id="closeMenu" aria-label="Close menu">×</button></div><button class="navbtn active" data-page="home" id="navHome"></button><button class="navbtn" data-page="timeline" id="navTimeline"></button><button class="navbtn" data-page="quiz" id="navQuiz"></button><button class="navbtn" data-page="stats" id="navStats"></button></aside>
<main class="layout" id="main">
<section class="page active" id="home"><div class="hero"><div class="hero-ornament" aria-hidden="true">QH<span>1917 / 1937</span></div><div class="hero-content"><div class="eyebrow" id="heroEyebrow"></div><h1 id="heroTitle"></h1><p class="lead" id="heroDesc"></p><button class="cta" id="heroStart"></button></div></div><div class="cards"><div class="card"><div class="number">124</div><h3 id="card1"></h3></div><div class="card"><div class="number">3</div><h3 id="card2"></h3></div><div class="card"><div class="number">5</div><h3 id="card3"></h3></div></div></section>
<section class="page" id="timeline"><span class="eyebrow">1917–1937 / ARCHIVE</span><h1 id="timelineTitle"></h1><p class="timeline-intro" id="timelineIntro"></p><div class="timeline" id="timelineItems"></div></section>
<section class="page" id="quiz"><div id="intro" class="quiz-box card"><span class="eyebrow" id="introLabel"></span><h1 id="introTitle"></h1><p id="introDesc"></p><label for="username" id="nameLabel"></label><input class="field" id="username" maxlength="40" autocomplete="nickname"><button class="cta" id="start"></button><p id="nameError" class="warning hidden"></p></div>
<div id="quizPanel" class="quiz-box card hidden"><div class="flex"><span class="eyebrow" id="period"></span><strong id="counter"></strong></div><div class="bar"><span id="bar"></span></div><h2 id="question"></h2><p class="hint" id="multiHint"></p><div class="options" id="options"></div><p id="warning" class="warning hidden"></p><div class="flex actions"><button class="secondary" id="prev"></button><button class="cta" id="next"></button></div></div>
<div id="finish" class="quiz-box card hidden"><span class="eyebrow" id="finishLabel"></span><h1 id="finishTitle"></h1><p id="greeting"></p><div class="result" id="score"></div><p id="saveStatus"></p><button class="secondary" id="reviewBtn"></button><button class="cta" id="homeBtn"></button><div id="review" class="hidden"></div></div></section>
<section class="page" id="stats"><h1 id="statsTitle"></h1><div class="card"><p id="statsNote"></p><div class="stats-grid"><div class="card"><div class="muted" id="participantsLabel"></div><div class="number" id="participants">0</div></div><div class="card"><div class="muted" id="averageLabel"></div><div class="number" id="average">0</div></div><div class="card"><div class="muted" id="perfectLabel"></div><div class="number" id="perfect">0</div></div></div></div></section>
</main><footer class="footer">© 2026 ERYON · QAZAQ HISTORY · <span id="rights"></span></footer>
